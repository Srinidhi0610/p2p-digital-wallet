# ===================================================================
# Test Database Configuration
# Uses H2 in PostgreSQL compatibility mode for hermetic automated tests.
# Production settings in src/main/resources/application.properties remain unchanged.
# ===================================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Test JWT Security Configuration
# Safe, isolated 256-bit secret for hermetic automated tests
# ===================================================================
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-32-characters-minimum!
jwt.expiration-ms=86400000

