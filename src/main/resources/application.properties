# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=p2p-digital-wallet
server.port=${PORT:8080}

# ===================================================================
# PostgreSQL Database Configuration
# Configured via environment variables with sensible local defaults.
# Passwords and sensitive credentials must never be hard-coded.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:p2p_wallet}}
spring.datasource.username=${DB_USERNAME:srinidhi}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT Security Configuration
# Minimum 256 bits (32 characters) for HMAC-SHA256
# Provide via JWT_SECRET environment variable in production
# ===================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

